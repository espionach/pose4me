<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New shoot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,'Helvetica Neue',sans-serif;color:#26211E;background:#EDE7DD}
a{color:#26211E;text-decoration:none}a:hover{color:#C8375E}
.paper{background-color:#FBF8F3;background-image:radial-gradient(rgba(38,33,30,.05) 1px,transparent 1px);background-size:14px 14px}
#shoot-name::placeholder{color:#8A8078}
</style>
</helmet>
<div class="paper" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 0 20px; gap: 26px">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Main.dc.html" aria-label="Cancel new shoot" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #E6DED3; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#26211E" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="position: relative; display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.1">new shoot</h1>
<svg aria-hidden="true" style="position: absolute; right: 10px; top: -6px; transform: rotate(14deg); pointer-events: none" width="46" height="46" viewBox="0 0 40 40" stroke="#26211E" stroke-width="1.6"><circle cx="20" cy="10" r="6.5" fill="#F7C6CF"></circle><circle cx="29.5" cy="17" r="6.5" fill="#F7C6CF"></circle><circle cx="26" cy="28" r="6.5" fill="#F7C6CF"></circle><circle cx="14" cy="28" r="6.5" fill="#F7C6CF"></circle><circle cx="10.5" cy="17" r="6.5" fill="#F7C6CF"></circle><circle cx="20" cy="20" r="5" fill="#F8E7A6"></circle></svg>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="shoot-name" style="font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #6B625B">shoot name</label>
<input id="shoot-name" placeholder="e.g. golden hour picnic" value="{{name}}" onChange="{{onName}}" style="height: 60px; border: 1.5px solid {{nameBorder}}; border-radius: 18px; background: #FFFFFF; padding: 0 16px; box-sizing: border-box; font-family: 'Young Serif', Georgia, serif; font-size: 22px; color: #26211E; outline: none; box-shadow: 0 2px 0 #E6DED3">
</div>

<div style="display: flex; gap: 10px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<label for="shoot-date" style="font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #6B625B">date</label>
<input id="shoot-date" type="date" value="{{date}}" onChange="{{onDate}}" style="height: 52px; border: 1.5px solid #E6DED3; border-radius: 18px; background: #FFFFFF; padding: 0 14px; box-sizing: border-box; width: 100%; font: 600 15px Figtree, sans-serif; color: #26211E; outline: none">
</div>
<div style="width: 136px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
<label for="shoot-time" style="font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #6B625B">time</label>
<input id="shoot-time" type="time" value="{{time}}" onChange="{{onTime}}" style="height: 52px; border: 1.5px solid #E6DED3; border-radius: 18px; background: #FFFFFF; padding: 0 14px; box-sizing: border-box; width: 100%; font: 600 15px Figtree, sans-serif; color: #26211E; outline: none">
</div>
</div>


<svg aria-hidden="true" style="position: absolute; left: 34px; bottom: 132px; transform: rotate(-10deg); pointer-events: none" width="40" height="40" viewBox="0 0 40 40" fill="#F8E7A6" stroke="#26211E" stroke-width="1.8" stroke-linejoin="round"><path d="M20 4l4.7 10 11 1.2-8.2 7.4 2.3 10.8L20 28l-9.8 5.4 2.3-10.8-8.2-7.4 11-1.2z"></path></svg>
<svg aria-hidden="true" style="position: absolute; right: 40px; bottom: 150px; transform: rotate(8deg); pointer-events: none" width="46" height="26" viewBox="0 0 46 26" fill="none" stroke="#B08FD8" stroke-width="2.6" stroke-linecap="round"><path d="M3 18c6 0 9-12 4-12s-3 14 7 14 7-14 14-14 5 14 15 12"></path></svg>

<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<a href="Import.dc.html" style="position: absolute; z-index: 5; left: 20px; right: 20px; bottom: 32px; height: 58px; border-radius: 29px; background: #26211E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px rgba(38,33,30,.22)">
next · pick photos
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
<button disabled style="position: absolute; z-index: 5; left: 20px; right: 20px; bottom: 32px; height: 58px; border-radius: 29px; background: #E6DED3; color: #6B625B; border: none; font: 600 16px Figtree, sans-serif">name your shoot to continue</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { name: '', date: '2026-10-18', time: '17:30' };
}
renderVals() {
const s = this.state;
const ready = s.name.trim().length > 0;
return {
name: s.name,
date: s.date,
time: s.time,
onName: (e) => this.setState({ name: e.target.value }),
onDate: (e) => this.setState({ date: e.target.value }),
onTime: (e) => this.setState({ time: e.target.value }),
nameBorder: ready ? '#26211E' : '#E6DED3',
ready: ready,
notReady: !ready
};
}
}
</script>
</body>
</html>
