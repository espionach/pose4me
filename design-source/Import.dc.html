<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera roll</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Figtree,'Helvetica Neue',sans-serif;color:#26211E;background:#EDE7DD}
a{color:#26211E;text-decoration:none}a:hover{color:#C8375E}
.paper{background-color:#FBF8F3;background-image:radial-gradient(rgba(38,33,30,.05) 1px,transparent 1px);background-size:14px 14px}
</style>
</helmet>
<div class="paper" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 0 20px; gap: 18px">

<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Plan.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1.5px solid #E6DED3; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#26211E" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 32px; line-height: 1.1">camera roll</h1>
<div style="font-size: 14px; color: #6B625B">pick poses for golden hour picnic</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{photos}}" as="ph" hint-placeholder-count="12">
<button aria-label="{{ph.label}}" aria-pressed="{{ph.selected}}" onClick="{{ph.toggle}}" style="position: relative; height: 138px; border-radius: 14px; border: {{ph.border}}; box-sizing: border-box; background: {{ph.bg}}; padding: 0; display: flex; align-items: flex-end; justify-content: center; cursor: pointer">
<sc-if value="{{ph.isSit}}" hint-placeholder-val="{{ true }}"><svg width="54" height="76" viewBox="0 0 100 140" fill="none" stroke="#26211E" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="44" cy="40" r="11"></circle><path d="M46 51L52 92L80 94L84 122M52 92L30 100M48 60L66 76M48 60L32 84"></path></svg></sc-if>
<sc-if value="{{ph.isStand}}" hint-placeholder-val="{{ false }}"><svg width="54" height="76" viewBox="0 0 100 140" fill="none" stroke="#26211E" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="28" r="11"></circle><path d="M50 39L50 84M50 50L34 66L44 76M50 50L66 64L72 44M50 84L40 124M50 84L60 124"></path></svg></sc-if>
<sc-if value="{{ph.isJump}}" hint-placeholder-val="{{ false }}"><svg width="54" height="76" viewBox="0 0 100 140" fill="none" stroke="#26211E" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="30" r="11"></circle><path d="M50 41L50 86M50 52L30 26M50 52L70 26M50 86L36 118M50 86L66 110L58 126"></path></svg></sc-if>
<sc-if value="{{ph.selected}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 13px; background: #C8375E; color: #FFFFFF; font: 700 14px Figtree, sans-serif; display: flex; align-items: center; justify-content: center">{{ph.badge}}</span></sc-if>
<sc-if value="{{ph.unselected}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; border-radius: 12px; border: 2px solid #FFFFFF; box-sizing: border-box"></span></sc-if>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: linear-gradient(rgba(251,248,243,0), #FBF8F3 40%)"></div>
<sc-if value="{{hasAny}}" hint-placeholder-val="{{ true }}">
<a href="Pose.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 32px; height: 58px; border-radius: 29px; background: #26211E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; box-shadow: 0 10px 24px rgba(38,33,30,.22)">
{{nextLabel}}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</sc-if>
<sc-if value="{{noneSelected}}" hint-placeholder-val="{{ false }}">
<button disabled style="position: absolute; left: 20px; right: 20px; bottom: 32px; height: 58px; border-radius: 29px; background: #E6DED3; color: #6B625B; border: none; font: 600 16px Figtree, sans-serif">select at least one photo</button>
</sc-if>
<svg style="position: absolute; right: 30px; top: 58px; transform: rotate(12deg); pointer-events: none" width="38" height="38" viewBox="0 0 24 24" fill="#F8E7A6" stroke="#26211E" stroke-width="1.2" stroke-linejoin="round"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z"></path></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { order: [2, 0, 4, 7] };
}
renderVals() {
const order = this.state.order;
const roll = [
['#F7C6CF', 'stand'], ['#E2D5F2', 'jump'], ['#F8E7A6', 'sit'],
['#CFE3C4', 'sit'], ['#CFE0F2', 'jump'], ['#F7C6CF', 'stand'],
['#F8E7A6', 'jump'], ['#E2D5F2', 'stand'], ['#CFE3C4', 'sit'],
['#CFE0F2', 'stand'], ['#F7C6CF', 'sit'], ['#F8E7A6', 'stand']
];
const n = order.length;
return {
photos: roll.map((r, i) => {
const k = order.indexOf(i);
return {
bg: r[0],
isSit: r[1] === 'sit',
isStand: r[1] === 'stand',
isJump: r[1] === 'jump',
selected: k >= 0,
unselected: k < 0,
badge: k + 1,
border: k >= 0 ? '3px solid #26211E' : '3px solid transparent',
label: 'Photo ' + (i + 1) + (k >= 0 ? ', selected ' + (k + 1) : ''),
toggle: () => {
const o = this.state.order;
this.setState({ order: o.indexOf(i) >= 0 ? o.filter((x) => x !== i) : o.concat([i]) });
}
};
}),
hasAny: n > 0,
noneSelected: n === 0,
nextLabel: 'next · ' + n + ' selected'
};
}
}
</script>
</body>
</html>
